<script id="snapshot" type="application/json">{"issues": [{"id": 1, "summary": "Scaffold: git, Makefile, coco-libs shim, RG6 black screen with 4-color artifact test pattern, BREAK exits", "description": "The gate for everything else. bunny-jump is a proof-of-concept platformer derived from ~/github/bunny (a CG3 128x96 hopping-bunny demo), but this game uses RG6 (PMODE 4, 256x192 dots = 128x192 artifact pixels, 4 artifact colors: black, blue, red/orange, white). Primary colors are white and black; red is reserved for death and hearts.\n\nBuild:\n- git is already initialized (commit on the default branch, no feature branches).\n- Makefile mirroring ~/github/bunny/Makefile, which itself mirrors coco/make/demo.mk (demo.mk cannot be included because it hardcodes ../../ paths). COCO ?= $(HOME)/github/coco, FC = python3 $(COCO)/tools/fc.py, ROM-mode kernel $(COCO)/kernel/build/kernel.{map,bin}, 32K, built via $(MAKE) -C $(COCO)/kernel when missing.\n- XROAR_EXTRA = -tv-type ntsc -tv-input cmp-br -kbd-translate. The -tv flags are what turn on artifact color (see coco/src/bounce/Makefile and coco/PROJECT_SETUP.md:105).\n- build/coco-libs.fs generated by make as absolute INCLUDE lines for $(COCO)/lib/{rg-pixel,sprite,keyboard,bye}.fs (bye.fs brings vdg.fs and screen.fs). Add font5x7 etc. only when a later issue needs it.\n- bunny-jump.fs: rg-init (coco/lib/rg-pixel.fs: 6 set-sam-v, $F8 set-pia = CSS 1 black/white, clears 6144 B at vram-base), draw four bars filled with bytes $00, $55, $AA, $FF, loop until BREAK (KB-C2 KB-R6 KEY-HELD?, or KEY? 3 = as bunny.fs:372 does), then exit to BASIC. Reference for RG6 setup: coco/src/bounce/bounce.fs init-bounce.\n- .gitignore (build/, *.bin), README.md (what it is, prereqs: coco checkout, lwasm, XRoar with ROMs in ~/.xroar/roms, Pillow; make run), CREDITS.md copied from ~/github/bunny (LPC bunny art is CC-BY-SA).\n- make issues target: python3 tools/issues_html.py render issues.jsonl issues.html roadmap.jsonl --title=\"bunny-jump issues\" (the generator is already in tools/). issues.html is committed.\n\nOpen question this retires: which 2bpp code shows red under cmp-br. coco/lib/sprite.fs documents 1 = blue, 2 = red, but real NTSC phase is random at power-up and XRoar picks it with cmp-br vs cmp-rb. If $55 shows red, switch to cmp-rb rather than remapping art.\n\nVerify: make run; the bars read black, blue, red/orange, white. Record the result here.", "type": "feature", "status": "in-progress", "priority": "high", "tags": ["build", "graphics"], "created": "2026-09-15", "updated": "2026-09-15"}, {"id": 2, "summary": "make shot for RG6: headless XRoar RAM dump rendered by tools/rg6shot.py", "description": "Depends on #1. Verification tooling so every later issue can be checked without the live XRoar window. In bunny, window capture failed when XRoar sat on another macOS Space (bunny issues.jsonl #3), which is why bunny grew make shot.\n\n- Copy the shot target from ~/github/bunny/Makefile: xroar -ui null -ao null -run $(BIN) -trap pc=0x$(VSYNC_PC) -trap-range $(SHOT_AT)-$(SHOT_AT) -trap-snap build/shot.ram -trap-timeout 1 -timeout 50, where VSYNC_PC comes from awk over kernel.map for CODE_VSYNC. Wrap in perl alarm 60 as bunny does.\n- tools/rg6shot.py (new; bunny's tools/cg3shot.py renders CG3 only and is a starting point for reading the RAM dump format): read 6144 B at vram-base, decode 32 B per row x 192 rows into 2bpp artifact pixels, render with a 4-entry palette (black, blue, red/orange, white; order per the #1 finding), scale 4x horizontally by 2x vertically so the aspect matches the TV, write build/shot.png.\n- Requires the game loop to call vsync (the trap counts vsync calls), so SHOT_AT=n means frame n.\n\nVerify: make shot on the #1 test pattern produces four bars in the expected colors.", "type": "feature", "status": "in-progress", "priority": "high", "tags": ["tools", "verification"], "created": "2026-09-15", "updated": "2026-09-15"}, {"id": 3, "summary": "Sprite pipeline: tools/png2rg6.py for bunny, red bunny, carrot and heart as RG6 records with an ox/oy table", "description": "Depends on #1. Converts art into records the kernel spr-draw can draw.\n\nTarget format (coco/lib/sprite.fs): byte 0 w, byte 1 h, then ceil(w/4) bytes per row, 2 bits per artifact pixel MSB first. Code 0 = transparent (reads black on the black background), 1 = blue, 2 = red/orange, 3 = white. spr-draw ( addr x y -- ) is at coco/kernel/kernel.asm:1979: per-pixel, transparent, 8-bit x/y, NO clipping, NO offsets.\n\nStart from ~/github/bunny/tools/png2cg.py and tools/frames.json (copy assets/bunnysheet5.png and assets/extra/carrot*.txt). Differences from bunny's converter:\n- Header is 2 bytes (w h), not 4. Emit ox/oy separately: a small table or per-frame CONSTANTs, so the game can anchor frames of different sizes on the baseline (same anchor scheme as png2cg.py sheet_offset).\n- Double every source row (user decision 2026-09-15): RG6 artifact pixels are 2 dots wide by 1 scanline tall, so a 1:1 row copy squashes the bunny to half height. Doubling gives about 28x54, the same on-screen size as the bunny demo at 2x. oy doubles too.\n- No dbl-table, grass or anims output (bunny scripted its hop; this game uses physics, #5).\n- Color map, bunny: body and light grey -> 3 white; outline and mid grey -> 0 (black); ear pink, browns and nose: pick white or black so the bunny reads as a white silhouette with black detail. Check in preview.png.\n- Red bunny variant for death (#9): every white pixel -> 2. Cheap to emit now.\n- Carrot (user decision): bunny's carrot art uses o (orange) and c (cyan greens); map o -> 2 red/orange and c -> 1 blue. There is no true green in RG6 CSS 1. Keep carrot0-3 bite frames and trim.\n- Heart: new ASCII art (about 7 wide, doubled rows), all code 2. No heart art exists in bunny or coco.\n- Frames: hop1-4, hop1l-4l (mirrored), munch1-4, carrot0-3, heart, red variants of hop1/hop1l at minimum.\n- Output build/sprites.fs as DATA[PY name bytes.fromhex(\"...\") ]DATA blocks (literal hex, as bunny does; inline Python in DATA[PY breaks because fc.py comment stripping eats parentheses) and build/preview.png in the 4 artifact colors.\n\nVerify: make preview; frames look right with correct aspect; app still compiles; note total sprite bytes.\n\nUser decision 2026-09-15 (supersedes the white-on-black color notes above): white background like the bunny demo. The bunny keeps black outlines with red and blue accents (sheet outline and mid grey -> 0 black, body and light grey -> 3 white, pink ear/browns/nose -> 2 red or 1 blue, chosen in preview.png). Because kernel spr-draw treats code 0 as transparent it cannot draw black outlines, so sprites are drawn opaque by the blit in #12 with white (3) as the record background; there is no transparent code. Red variant for death: white body pixels -> 2, outline stays black.", "type": "feature", "status": "in-progress", "priority": "high", "tags": ["assets", "tools"], "created": "2026-09-15", "updated": "2026-09-15"}, {"id": 4, "summary": "Keyboard: held left/right arrows, edge-triggered space, BREAK to exit", "description": "Depends on #1. Direct matrix scanning so held keys work (KEY? only returns single presses).\n\n- KEY-HELD? ( col row -- f ) is in coco/lib/keyboard.fs:60, built on kernel KBD-SCAN.\n- Left arrow: KB-C5 KB-R3. Right arrow: KB-C6 KB-R3. Space: KB-C7 KB-R3. BREAK: KB-C2 KB-R6. Confirmed against the kernel KEY_TABLE (coco/kernel/kernel.asm:898-914: $20 space at column 7 row 3, arrows $1C-$1F in columns 3-6 row 3). The note in keyboard.fs about KB-R7 SPC and joysticks is stale; do not rely on it.\n- Words: left? right? ( -- f ) sampled once per frame; hop-pressed? ( -- f ) true only on the frame space goes down (keep last state in a VARIABLE) so holding space does not auto-repeat hops.\n- Run with -kbd-translate (already in XROAR_EXTRA).\n\nVerify: a debug build shows three indicator pixels/bars that light while left/right are held and flash once per space press. Remove or keep behind a flag afterwards.", "type": "feature", "status": "in-progress", "priority": "high", "tags": ["input"], "created": "2026-09-15", "updated": "2026-09-15"}, {"id": 5, "summary": "Hop physics: straight-up and diagonal hops with gravity, facing, frame by phase, erase/redraw on vsync", "description": "Depends on #3 and #4. The core mechanic and the biggest unknown: does the hop feel right on a 6809.\n\nControls (user spec): left/right choose direction, space hops. Space alone hops straight up. Space while holding an arrow hops up-left or up-right toward the next higher platform. Decide in this issue whether arrows also walk on the ground (not specified; default: arrows only turn the bunny while grounded, keeping the game about hops) and note the choice.\n\n- State in VARIABLEs: x, y in 8.8 fixed point (16-bit cells), vx, vy, grounded?, facing. Anchor = bottom center of the bunny (feet), using the ox/oy table from #3.\n- On hop: vy = -HOP_V, vx = 0 or +/-HOP_DX by arrow held. Each frame while airborne: vy += GRAVITY, x += vx, y += vy. Start with constants giving about 40 rows of lift and about 30 artifact px of reach, tune in #6.\n- Frame choice: grounded hop1; rising hop2; near apex hop3; falling hop4; mirrored set when facing left.\n- For now land on a fixed floor (y = 191) so this issue stands alone; platforms come in #6.\n- Clamp x so the sprite stays in 0..127 and y in 0..191: spr-draw does not clip and VRAM writes past the page corrupt memory.\n- Rendering: record the previous frame's record and position; after vsync, spr-erase-box the old box then spr-draw the new frame (pattern: coco/src/bounce/bounce.fs erase-one/draw-one, and bunny.fs draw-pending for drawing right after vsync). spr-erase-box (kernel.asm:2079) clears to 0, which #6 must account for.\n- Record make cycles (bunny Makefile has the cycles target) cost of one erase+draw for a 28x54 frame; spr-draw is per-pixel, so if it misses the frame budget, file a follow-up for a faster blit rather than blocking.\n\nVerify: make run; hop up, left, right; motion is smooth, no trails, no crash at screen edges. make shot at a few SHOT_AT values mid-hop.\n\nChange 2026-09-15: with the white background (#3), draw with the opaque blit from #12 instead of spr-draw/spr-erase-box, and erase by filling the old box with $FF. The blit is byte aligned, so bunny x moves in steps of 4 artifact pixels (one VRAM byte); keep x in 8.8 fixed point and snap to a multiple of 4 when drawing.", "type": "feature", "status": "open", "priority": "high", "tags": ["gameplay", "physics"], "created": "2026-09-15", "updated": "2026-09-15"}, {"id": 6, "summary": "Platforms: hardcoded level table, drawing, landing and falling collision", "description": "Depends on #5. Turns the hop into a platformer.\n\n- Level table: a DATA block or CREATE , list of platforms as (x1 x2 y) in artifact pixels, plus bunny start position and carrot position (used by #7). One hand-made level, staircase-like, so every platform is reachable by a straight or diagonal hop from the one below. Custom screen design is #11, not here.\n- Draw platforms as solid white (code 3) horizontal bars a few rows tall. Fast path: write $FF bytes directly into VRAM rows (32 B per row at vram-base, rv in coco/lib/rg-pixel.fs) instead of per-pixel rg-hline.\n- Collision: only when falling (vy > 0). If the feet move from above a platform top to at or below it this frame and feet x is within x1..x2, snap y to the top, vy = 0, vx = 0, grounded. Walking or hopping off an edge means falling. Bottom of screen is the floor. Hopping up through a platform from below is allowed (one-way platforms), simplest and common.\n- Erase damage: spr-erase-box clears the whole sprite box to black, so after erasing, redraw any platform rows that intersect the old box (cheap: re-fill those byte spans).\n- Tuning: set HOP_V, GRAVITY and HOP_DX from #5 so a hop clears the platform vertical gap with margin and a diagonal hop reaches the next platform horizontally. Record final constants here.\n\nVerify: make run; climb from the floor to the top platform using straight and diagonal hops; falling off edges works; no platform damage after hops.\n\nUser decision 2026-09-15: white background, so the screen is filled with $FF after rg-init and platforms are black (code 0, $00 bytes). Erase uses $FF fill, and the opaque blit from #12 overwrites its whole box with white, so platform repair after an erase still applies.", "type": "feature", "status": "open", "priority": "high", "tags": ["gameplay", "level"], "created": "2026-09-15", "updated": "2026-09-15"}, {"id": 7, "summary": "Carrot goal: touch detection, bunny eats carrot, LEVEL COMPLETE, restart", "description": "Depends on #6. Completes the proof-of-concept loop.\n\n- Carrot sits on the top platform at the position from the level table (#6), drawn with the carrot3 record from #3 (red/orange body, blue greens).\n- Detection: bounding-box overlap between the bunny frame box and the carrot box, only while grounded.\n- Eat sequence: freeze input; play munch1-4 with the carrot shrinking carrot3 -> carrot2 -> carrot1 -> carrot0 on bites, like the bunny demo's eat anim (~/github/bunny/tools/frames.json anims, events 2 carrot bite). Hold counts per frame are fine; no sound yet (#10).\n- Then draw LEVEL COMPLETE text. coco/src/bounce/bounce.fs defines rg-char and a HUD using font5x7 (INCLUDE lib/font5x7.fs, init-font, KVAR-RGCHARMIN etc. set in init-bounce); reuse that.\n- Space restarts the level (redraw screen, reset bunny state).\n\nVerify: make run; climb, touch the carrot, watch it get eaten, see the message, restart works. make shot of the complete screen.", "type": "feature", "status": "open", "priority": "high", "tags": ["gameplay"], "created": "2026-09-15", "updated": "2026-09-15"}, {"id": 8, "summary": "Hearts HUD: red hearts showing lives (display only)", "description": "Depends on #3 and #6. Lives display; losing lives is #9.\n\n- VARIABLE lives, starting at 3.\n- Draw one heart record (#3, all code 2 red) per life along the top-left, spaced a few pixels apart, clear of the top platform and the bunny's highest hop. Redraw on level start and whenever lives changes.\n- If the bunny can hop into the HUD area, either keep the level below it or redraw hearts after erases (same pattern as platform repair in #6).\n\nVerify: make shot shows three red hearts; changing the start value shows that many.\n\nUser decision 2026-09-15: background is white, so hearts are red on white; draw them with the #12 blit.", "type": "feature", "status": "open", "priority": "medium", "tags": ["hud", "graphics"], "created": "2026-09-15", "updated": "2026-09-15"}, {"id": 9, "summary": "Death: red bunny and losing a heart (deferred until the mechanic is proven)", "description": "Deferred by the user: the death theme (the user called it the sensitive topic of murder and death) will be discussed after the hop mechanic works. Do not start without that discussion.\n\nKnown pieces so far: red bunny frames are produced by #3 (white -> code 2), lives and hearts by #8. Undecided: what kills the bunny (fall height, hazards, enemies), what happens on death, game over.", "type": "feature", "status": "deferred", "priority": "low", "tags": ["gameplay", "design"], "created": "2026-09-15", "updated": "2026-09-15"}, {"id": 10, "summary": "Sound: boing on hop, crunch on eat", "description": "After the proof of concept. ~/github/bunny has working effects: boing (bunny.fs:215), crunch and chirp, on coco/lib/wavetable.fs and async-sound.fs, stepped from the main loop (bunny.fs:370 vsync draw-pending snd-frame tick). Port boing for hop start and crunch for carrot bites. Watch the frame budget: spr-draw is per-pixel and sound stepping adds cycles.", "type": "feature", "status": "open", "priority": "low", "tags": ["sound"], "created": "2026-09-15", "updated": "2026-09-15"}, {"id": 11, "summary": "Custom screen design: level data format and multiple levels", "description": "After the proof of concept. The user plans custom screen designs. #6 hardcodes one level table (platforms x1 x2 y, bunny start, carrot position). This issue defines a level format (likely ASCII maps converted by a tool, the way bunny's assets/extra/*.txt art is converted), supports several levels, and advances to the next level after the carrot is eaten (#7).", "type": "feature", "status": "open", "priority": "low", "tags": ["level", "tools"], "created": "2026-09-15", "updated": "2026-09-15"}, {"id": 12, "summary": "Opaque byte-aligned RG6 blit CODE word (replaces spr-draw for the white background)", "description": "Depends on #1; needed by #5-#8. User decision 2026-09-15: white background with black-outlined bunny, red and blue accents. Kernel spr-draw (coco/kernel/kernel.asm:1979) treats code 0 as transparent, so it cannot draw black, and it is per-pixel (slow). Replace it with an opaque blit modeled on bunny's CODE blit2x (~/github/bunny/bunny.fs:37), but 1x: the records from #3 already have doubled rows.\n\n- CODE blit ( addr x y -- ): record = w h (coco/lib/sprite.fs layout), then ceil(w/4) bytes per row. x is the left edge in artifact pixels and must be a multiple of 4 (x/4 = byte column), y is the top row. Copy each row's bytes straight into VRAM at vram-base + y*32 + x/4. No clipping: callers keep the box on screen. CODE words must preserve X (IP), U (data stack) and S, and end with ;NEXT (see bunny blit2x).\n- white-box ( addr x y -- ) or a generic fill-box ( x y wbytes h byte -- ) to erase the old frame to $FF.\n- Put both in blit.fs, INCLUDEd by the game.\n\nTrade-off accepted: horizontal motion is in 4-artifact-pixel steps; a masked sub-byte blit is a possible follow-up.\n\nVerify: a test program draws the #3 frames on a white screen at several x; make shot (#2) matches preview.png; record make cycles cost for a 28x54 frame (7 bytes x 54 rows).", "type": "feature", "status": "in-progress", "priority": "high", "tags": ["graphics", "asm"], "created": "2026-09-15", "updated": "2026-09-15"}], "roadmap": [{"rank": 1, "id": 1, "why": "The gate: nothing builds or runs without it. It also retires the first unknown, whether red actually shows under cmp-br, before any art is converted.", "added": "2026-09-15"}, {"rank": 2, "id": 2, "why": "Cheap tooling that makes every later issue verifiable from a PNG, without depending on the XRoar window (which bunny found unreliable on another macOS Space).", "added": "2026-09-15"}, {"rank": 3, "id": 3, "why": "Every gameplay issue draws these records. Doubled rows and the 2-byte RG6 header are decided, so this is straightforward conversion work.", "added": "2026-09-15"}, {"rank": 4, "id": 12, "why": "The white background means spr-draw cannot draw black outlines, so every gameplay issue now draws through this blit. It also retires the frame-budget worry about per-pixel spr-draw.", "added": "2026-09-15"}, {"rank": 5, "id": 4, "why": "Small, and hop physics cannot be tested without held-key input.", "added": "2026-09-15"}, {"rank": 6, "id": 5, "why": "The biggest unknown: whether the hop looks smooth and feels right with byte-aligned (4 pixel) horizontal steps from the #12 blit. Everything after it is tuned against its constants.", "added": "2026-09-15"}, {"rank": 7, "id": 6, "why": "Makes it a platformer. Depends on the hop constants from #5 and repairs platforms the white erase box covers.", "added": "2026-09-15"}, {"rank": 8, "id": 7, "why": "Completes the proof-of-concept loop: climb, reach the carrot, eat it, level complete.", "added": "2026-09-15"}, {"rank": 9, "id": 8, "why": "First step toward lives, and cheap once the heart record from #3 exists. Kept after the core loop because it does not affect the mechanic.", "added": "2026-09-15"}]}</script>
<script>
(function () {
  var STATUS_ORDER = ['open', 'in-progress', 'done', 'deferred', 'wontfix'];
  var PRIORITY_ORDER = ['high', 'medium', 'low'];
  var LIVE = ['open', 'in-progress'];
  var KEY = 'issues-view:' + location.pathname;
  // Longest alternative first: "jsonl" must win over "json".
  var PATH_RE = /\b((?:[\w.-]+\/)*[\w.-]+\.(?:jsonl|json|md|html|css|js|ts|tsx|jsx|py|rb|go|rs|java|c|h|cpp|sh|toml|ya?ml|cfg|ini|txt|bas|dsk|png))(:\d+(?:-\d+)?)?/g;

  var issues = [];
  var active = { status: [], type: [], tag: [] };
  var q = document.getElementById('q');
  var list = document.getElementById('list');
  var count = document.getElementById('count');
  var empty = document.getElementById('empty');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function rank(v, order) {
    var i = order.indexOf(v);
    return i === -1 ? order.length : i;
  }

  function markup(text) {
    return String(text).split('\n\n').map(function (para) {
      return '<p>' + esc(para).replace(PATH_RE, '<code>$&</code>').replace(/\n/g, '<br>') + '</p>';
    }).join('');
  }

  function summaryOf(i) { return i.summary || i.title || '(untitled)'; }
  function tagsOf(i) { return i.tags || i.labels || []; }

  function card(i) {
    var status = i.status || '?', priority = i.priority || '?', type = i.type || '?';
    var el = document.createElement('article');
    el.className = 'card';
    el.id = 'i' + i.id;
    el.dataset.status = status;
    el.dataset.type = type;
    el.dataset.tags = tagsOf(i).join(' ');
    el.innerHTML =
      '<header><button class="row" aria-expanded="false">' +
      '<span class="id">#' + esc(i.id) + '</span>' +
      '<span class="summary">' + esc(summaryOf(i)) + '</span>' +
      '<span class="chips">' +
        '<span class="chip st-' + esc(status) + '">' + esc(status) + '</span>' +
        '<span class="chip pr-' + esc(priority) + '">' + esc(priority) + '</span>' +
        '<span class="chip ty">' + esc(type) + '</span>' +
      '</span><span class="caret" aria-hidden="true"></span></button></header>' +
      '<div class="body" hidden><div class="desc">' +
      markup(i.description || '(no description)') + '</div><footer>' +
      tagsOf(i).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') +
      '<span class="meta"><code>' + esc(i.file || '-') + '</code> &middot; created ' +
      esc(i.created || '?') + ' &middot; updated ' + esc(i.updated || '?') +
      '</span></footer></div>';
    el.querySelector('.row').addEventListener('click', function () {
      setOpen(el, el.querySelector('.body').hidden);
    });
    return el;
  }

  function setOpen(el, open) {
    el.querySelector('.row').setAttribute('aria-expanded', open);
    el.querySelector('.body').hidden = !open;
  }

  // The roadmap stores only rank, id and why. Everything shown here is joined
  // from the tracker, so an entry pointing at a missing or finished issue is
  // visibly wrong rather than quietly stale.
  function drawRoadmap(plan, byId) {
    if (!plan.length) return;
    var host = document.getElementById('plan');
    plan.slice().sort(function (a, b) { return (a.rank || 0) - (b.rank || 0); })
      .forEach(function (e) {
        var issue = byId[e.id];
        var li = document.createElement('li');
        li.className = 'step';
        var head, warn = '';
        if (!issue) {
          head = '#' + esc(e.id) + ' is not in the tracker';
          warn = 'no such issue';
          li.className += ' bad';
        } else {
          head = '<a href="#i' + esc(e.id) + '">#' + esc(e.id) + ' ' +
                 esc(summaryOf(issue)) + '</a> <span class="chip st-' +
                 esc(issue.status) + '">' + esc(issue.status) + '</span>';
          if (LIVE.indexOf(issue.status) === -1) {
            warn = 'already ' + issue.status + ', take it off the roadmap';
            li.className += ' bad';
          }
        }
        li.innerHTML = '<span class="rank">' + esc(e.rank || '?') + '.</span>' +
          '<span class="what">' + head +
          '<span class="why">' + esc(e.why || '') + '</span>' +
          (warn ? '<span class="warn">' + esc(warn) + '</span>' : '') + '</span>';
        var link = li.querySelector('a');
        if (link) {
          link.addEventListener('click', function () {
            var target = document.getElementById('i' + e.id);
            if (target) { target.hidden = false; setOpen(target, true); }
          });
        }
        host.appendChild(li);
      });
    document.getElementById('roadmap').hidden = false;
  }

  function pills(host, filter, values, counts) {
    document.getElementById(host).innerHTML = values.map(function (v) {
      return '<button class="pill" data-filter="' + filter + '" data-value="' + esc(v) + '">' +
        esc(v) + (counts ? ' <span class="n">' + counts[v] + '</span>' : '') + '</button>';
    }).join('');
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ active: active, q: q.value }));
    } catch (e) {}
  }

  function apply() {
    var needle = q.value.trim().toLowerCase();
    var shown = 0;
    [].forEach.call(list.children, function (el) {
      var ok =
        (!active.status.length || active.status.indexOf(el.dataset.status) !== -1) &&
        (!active.type.length || active.type.indexOf(el.dataset.type) !== -1) &&
        (!active.tag.length || active.tag.some(function (t) {
          return el.dataset.tags.split(' ').indexOf(t) !== -1;
        })) &&
        (!needle || el.textContent.toLowerCase().indexOf(needle) !== -1);
      el.hidden = !ok;
      if (ok) shown++;
    });
    empty.hidden = shown !== 0;
    count.textContent = shown + ' of ' + issues.length + ' shown';
    [].forEach.call(document.querySelectorAll('.pill'), function (p) {
      p.setAttribute('aria-pressed', active[p.dataset.filter].indexOf(p.dataset.value) !== -1);
    });
    save();
  }

  function draw(data, plan, note) {
    issues = data.slice().sort(function (a, b) {
      return rank(a.status, STATUS_ORDER) - rank(b.status, STATUS_ORDER) ||
             rank(a.priority, PRIORITY_ORDER) - rank(b.priority, PRIORITY_ORDER) ||
             (a.id || 0) - (b.id || 0);
    });

    var counts = {}, byId = {};
    STATUS_ORDER.forEach(function (s) { counts[s] = 0; });
    issues.forEach(function (i) {
      counts[i.status] = (counts[i.status] || 0) + 1;
      byId[i.id] = i;
    });

    list.innerHTML = '';
    issues.forEach(function (i) { list.appendChild(card(i)); });
    drawRoadmap(plan || [], byId);

    pills('f-status', 'status', STATUS_ORDER.filter(function (s) { return counts[s]; }), counts);
    pills('f-type', 'type', unique(issues.map(function (i) { return i.type || '?'; })));
    pills('f-tag', 'tag', unique([].concat.apply([], issues.map(tagsOf))));

    [].forEach.call(document.querySelectorAll('.pill'), function (p) {
      p.addEventListener('click', function () {
        var l = active[p.dataset.filter], i = l.indexOf(p.dataset.value);
        if (i === -1) l.push(p.dataset.value); else l.splice(i, 1);
        apply();
      });
    });

    var open = (counts.open || 0) + (counts['in-progress'] || 0);
    document.getElementById('lede').innerHTML =
      issues.length + ' issues, ' + open + ' of them still open' +
      ((plan && plan.length) ? ', ' + plan.length + ' on the roadmap' : '') +
      '. Read from <code>issues.jsonl</code>.';
    if (note) {
      var n = document.getElementById('note');
      n.textContent = note;
      n.hidden = false;
    }

    try {
      var s = JSON.parse(localStorage.getItem(KEY) || '{}');
      if (s.active) active = s.active;
      if (s.q) q.value = s.q;
    } catch (e) {}

    apply();

    if (location.hash) {
      var target = document.querySelector(location.hash);
      if (target && target.classList.contains('card')) {
        target.hidden = false;
        setOpen(target, true);
        target.scrollIntoView();
      }
    }
  }

  function unique(a) {
    return a.filter(function (v, i) { return a.indexOf(v) === i; }).sort();
  }

  q.addEventListener('input', apply);
  document.getElementById('reset').addEventListener('click', function () {
    active = { status: [], type: [], tag: [] };
    q.value = '';
    apply();
  });
  document.getElementById('expand').addEventListener('click', function () {
    [].forEach.call(list.children, function (c) { if (!c.hidden) setOpen(c, true); });
  });
  document.getElementById('collapse').addEventListener('click', function () {
    [].forEach.call(list.children, function (c) { setOpen(c, false); });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
    if (e.key === 'Escape' && document.activeElement === q) { q.value = ''; apply(); }
  });

  function lines(text) {
    return text.split('\n').filter(function (l) { return l.trim(); }).map(JSON.parse);
  }

  function grab(name) {
    return fetch(name, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(lines);
  }

  // The live files first. Browsers refuse a file:// fetch, so fall back to the
  // snapshot baked in at build time and say which one is on screen. A missing
  // roadmap.jsonl is not an error: the section just stays hidden.
  grab('issues.jsonl')
    .then(function (data) {
      grab('roadmap.jsonl')
        .catch(function () { return []; })
        .then(function (plan) { draw(data, plan); });
    })
    .catch(function () {
      var snap = JSON.parse(document.getElementById('snapshot').textContent);
      draw(snap.issues, snap.roadmap,
        'Showing the snapshot saved when this page was last built, because the browser would ' +
        'not read the .jsonl files from disk. To see them live, serve the directory ' +
        '(python3 -m http.server) and open it over http, or rebuild this page.');
    });
})();
</script>
</body>
</html>
