<script id="snapshot" type="application/json">{"issues": [{"id": 1, "summary": "Scaffold: git, Makefile, coco-libs shim, RG6 black screen with 4-color artifact test pattern, BREAK exits", "description": "The gate for everything else. bunny-jump is a proof-of-concept platformer derived from ~/github/bunny (a CG3 128x96 hopping-bunny demo), but this game uses RG6 (PMODE 4, 256x192 dots = 128x192 artifact pixels, 4 artifact colors: black, blue, red/orange, white). Primary colors are white and black; red is reserved for death and hearts.\n\nBuild:\n- git is already initialized (commit on the default branch, no feature branches).\n- Makefile mirroring ~/github/bunny/Makefile, which itself mirrors coco/make/demo.mk (demo.mk cannot be included because it hardcodes ../../ paths). COCO ?= $(HOME)/github/coco, FC = python3 $(COCO)/tools/fc.py, ROM-mode kernel $(COCO)/kernel/build/kernel.{map,bin}, 32K, built via $(MAKE) -C $(COCO)/kernel when missing.\n- XROAR_EXTRA = -tv-type ntsc -tv-input cmp-br -kbd-translate. The -tv flags are what turn on artifact color (see coco/src/bounce/Makefile and coco/PROJECT_SETUP.md:105).\n- build/coco-libs.fs generated by make as absolute INCLUDE lines for $(COCO)/lib/{rg-pixel,sprite,keyboard,bye}.fs (bye.fs brings vdg.fs and screen.fs). Add font5x7 etc. only when a later issue needs it.\n- bunny-jump.fs: rg-init (coco/lib/rg-pixel.fs: 6 set-sam-v, $F8 set-pia = CSS 1 black/white, clears 6144 B at vram-base), draw four bars filled with bytes $00, $55, $AA, $FF, loop until BREAK (KB-C2 KB-R6 KEY-HELD?, or KEY? 3 = as bunny.fs:372 does), then exit to BASIC. Reference for RG6 setup: coco/src/bounce/bounce.fs init-bounce.\n- .gitignore (build/, *.bin), README.md (what it is, prereqs: coco checkout, lwasm, XRoar with ROMs in ~/.xroar/roms, Pillow; make run), CREDITS.md copied from ~/github/bunny (LPC bunny art is CC-BY-SA).\n- make issues target: python3 tools/issues_html.py render issues.jsonl issues.html roadmap.jsonl --title=\"bunny-jump issues\" (the generator is already in tools/). issues.html is committed.\n\nOpen question this retires: which 2bpp code shows red under cmp-br. coco/lib/sprite.fs documents 1 = blue, 2 = red, but real NTSC phase is random at power-up and XRoar picks it with cmp-br vs cmp-rb. If $55 shows red, switch to cmp-rb rather than remapping art.\n\nVerify: make run; the bars read black, blue, red/orange, white. Record the result here.\n\nResolution (2026-09-15): Makefile (XROAR variable with -tv-type ntsc -tv-input cmp-br, generic %.bin rule and run-% target so any test program builds and runs, -include mk/*.mk fragments, cycles and issues targets), build/coco-libs.fs shim (rg-pixel, sprite, keyboard, bye), bunny-jump.fs test bands, .gitignore, README.md, CREDITS.md. App 725 B at $3000. User confirmed the bands read black, blue, red, white top to bottom, so under cmp-br $55 (code 01) is blue and $AA (code 10) is red; no switch to cmp-rb. This matches the XRoar source (see #2). Not done here: window screen capture of XRoar stalls in ScreenCaptureKit on this machine, so verification goes through make shot (#2).", "type": "feature", "status": "done", "priority": "high", "tags": ["build", "graphics"], "created": "2026-09-15", "updated": "2026-09-15"}, {"id": 2, "summary": "make shot for RG6: headless XRoar RAM dump rendered by tools/rg6shot.py", "description": "Depends on #1. Verification tooling so every later issue can be checked without the live XRoar window. In bunny, window capture failed when XRoar sat on another macOS Space (bunny issues.jsonl #3), which is why bunny grew make shot.\n\n- Copy the shot target from ~/github/bunny/Makefile: xroar -ui null -ao null -run $(BIN) -trap pc=0x$(VSYNC_PC) -trap-range $(SHOT_AT)-$(SHOT_AT) -trap-snap build/shot.ram -trap-timeout 1 -timeout 50, where VSYNC_PC comes from awk over kernel.map for CODE_VSYNC. Wrap in perl alarm 60 as bunny does.\n- tools/rg6shot.py (new; bunny's tools/cg3shot.py renders CG3 only and is a starting point for reading the RAM dump format): read 6144 B at vram-base, decode 32 B per row x 192 rows into 2bpp artifact pixels, render with a 4-entry palette (black, blue, red/orange, white; order per the #1 finding), scale 4x horizontally by 2x vertically so the aspect matches the TV, write build/shot.png.\n- Requires the game loop to call vsync (the trap counts vsync calls), so SHOT_AT=n means frame n.\n\nVerify: make shot on the #1 test pattern produces four bars in the expected colors.\n\nProgress (2026-09-15): mk/shot.mk (SHOT_PROG ?= $(NAME), SHOT_AT ?= 1; VSYNC_PC and VRAM_BASE read from kernel.map, currently $29C5 and $0600) and tools/rg6shot.py (RAM dump from address 0, 32768 B; 192x32 B page; 4x2 scale to 512x384; palette black, blue, red, white; --rb swaps). make shot on the test bands gives the four bands in order; the #12 blittest shot also rendered correctly. Color order evidence: ~/github/xroar/src/machine.c:130 maps cmp-br to TV_INPUT_CMP_KBRW (black, blue, red, white), src/dragon/dragon.c:963-971 sets the phase; user confirmed the live bands. XRoar 1.10 has no headless screenshot option (src/xroar.c:2440 needs a file requester, null under -ui null), hence the RAM-dump approach. Palette RGB values are approximations. Waiting for the user to run make shot. Follow-ups not filed yet: measured palette RGB, multi-frame strips.", "type": "feature", "status": "in-progress", "priority": "high", "tags": ["tools", "verification"], "created": "2026-09-15", "updated": "2026-09-15"}, {"id": 3, "summary": "Sprite pipeline: tools/png2rg6.py for bunny, red bunny, carrot and heart as RG6 records with an ox/oy table", "description": "Depends on #1. Converts art into records the kernel spr-draw can draw.\n\nTarget format (coco/lib/sprite.fs): byte 0 w, byte 1 h, then ceil(w/4) bytes per row, 2 bits per artifact pixel MSB first. Code 0 = transparent (reads black on the black background), 1 = blue, 2 = red/orange, 3 = white. spr-draw ( addr x y -- ) is at coco/kernel/kernel.asm:1979: per-pixel, transparent, 8-bit x/y, NO clipping, NO offsets.\n\nStart from ~/github/bunny/tools/png2cg.py and tools/frames.json (copy assets/bunnysheet5.png and assets/extra/carrot*.txt). Differences from bunny's converter:\n- Header is 2 bytes (w h), not 4. Emit ox/oy separately: a small table or per-frame CONSTANTs, so the game can anchor frames of different sizes on the baseline (same anchor scheme as png2cg.py sheet_offset).\n- Double every source row (user decision 2026-09-15): RG6 artifact pixels are 2 dots wide by 1 scanline tall, so a 1:1 row copy squashes the bunny to half height. Doubling gives about 28x54, the same on-screen size as the bunny demo at 2x. oy doubles too.\n- No dbl-table, grass or anims output (bunny scripted its hop; this game uses physics, #5).\n- Color map, bunny: body and light grey -> 3 white; outline and mid grey -> 0 (black); ear pink, browns and nose: pick white or black so the bunny reads as a white silhouette with black detail. Check in preview.png.\n- Red bunny variant for death (#9): every white pixel -> 2. Cheap to emit now.\n- Carrot (user decision): bunny's carrot art uses o (orange) and c (cyan greens); map o -> 2 red/orange and c -> 1 blue. There is no true green in RG6 CSS 1. Keep carrot0-3 bite frames and trim.\n- Heart: new ASCII art (about 7 wide, doubled rows), all code 2. No heart art exists in bunny or coco.\n- Frames: hop1-4, hop1l-4l (mirrored), munch1-4, carrot0-3, heart, red variants of hop1/hop1l at minimum.\n- Output build/sprites.fs as DATA[PY name bytes.fromhex(\"...\") ]DATA blocks (literal hex, as bunny does; inline Python in DATA[PY breaks because fc.py comment stripping eats parentheses) and build/preview.png in the 4 artifact colors.\n\nVerify: make preview; frames look right with correct aspect; app still compiles; note total sprite bytes.\n\nUser decision 2026-09-15 (supersedes the white-on-black color notes above): white background like the bunny demo. The bunny keeps black outlines with red and blue accents (sheet outline and mid grey -> 0 black, body and light grey -> 3 white, pink ear/browns/nose -> 2 red or 1 blue, chosen in preview.png). Because kernel spr-draw treats code 0 as transparent it cannot draw black outlines, so sprites are drawn opaque by the blit in #12 with white (3) as the record background; there is no transparent code. Red variant for death: white body pixels -> 2, outline stays black.\n\nProgress (2026-09-15, before the white background decision was applied): tools/png2rg6.py and tools/frames.json (sheet, art, mirror and new recolor frame types), assets copied plus new assets/extra/heart.txt, mk/sprites.mk (PROG_DEPS += build/sprites.fs, preview target), spritetest.fs. Emits DATA[PY spr-NAME records, spr-NAME-ox/oy CONSTANTs (top-left offset from the anchor at the cell centre on the sheet baseline, oy doubled), seq-*/seq-*-len constants and spr ( n -- addr ). 19 frames, 4534 B: hop1 23x50, hop3 31x52, munch 24-26 x 34-46, carrot3 16x14, heart 7x12, red hop1r/hop1lr. Frame indexes: hop 0-3, hopl 4-7, munch 8-11, carrot 12-15, heart 16, red 17-18. Trimmed hop feet sit 0-4 scanlines above the anchor (hop1 bottom at oy+h = -2).\n\nProgress (2026-09-15, white background applied): png2rg6.py now converts with a transparent marker packed as white, pads every frame so ox and w are multiples of 4, maps outline (58,55,55) -> 0 black, mid grey (130,124,124) -> 1 blue, ear pink/browns/nose -> 2 red, body/light grey -> 3 white, and emits spr-oxy (signed ox oy bytes per frame index) for game code. 19 frames, 5778 B (hop1 28x54, hop3 36x56, carrot3 16x14, heart 8x12). spritetest.fs draws with blit on white; make shot SHOT_PROG=spritetest matches build/preview.png. Waiting for the user to look at make preview / make run-spritetest. Blue shading specks at the outline are filed as #15.\n\nResolution (2026-09-15): user ran make run and played the level: \"it seemed to play. there are issues, but it's not terrible\". Closed at about 80% per the working rule; the issues the user noticed get filed as new issues once described.", "type": "feature", "status": "done", "priority": "high", "tags": ["assets", "tools"], "created": "2026-09-15", "updated": "2026-09-15"}, {"id": 4, "summary": "Keyboard: held left/right arrows, edge-triggered space, BREAK to exit", "description": "Depends on #1. Direct matrix scanning so held keys work (KEY? only returns single presses).\n\n- KEY-HELD? ( col row -- f ) is in coco/lib/keyboard.fs:60, built on kernel KBD-SCAN.\n- Left arrow: KB-C5 KB-R3. Right arrow: KB-C6 KB-R3. Space: KB-C7 KB-R3. BREAK: KB-C2 KB-R6. Confirmed against the kernel KEY_TABLE (coco/kernel/kernel.asm:898-914: $20 space at column 7 row 3, arrows $1C-$1F in columns 3-6 row 3). The note in keyboard.fs about KB-R7 SPC and joysticks is stale; do not rely on it.\n- Words: left? right? ( -- f ) sampled once per frame; hop-pressed? ( -- f ) true only on the frame space goes down (keep last state in a VARIABLE) so holding space does not auto-repeat hops.\n- Run with -kbd-translate (already in XROAR_EXTRA).\n\nVerify: a debug build shows three indicator pixels/bars that light while left/right are held and flash once per space press. Remove or keep behind a flag afterwards.\n\nProgress (2026-09-15): input.fs: left-held? right-held? space-held? break? ( -- f ) live reads (flag = 0= 0=), read-input ( -- ) once per frame after vsync fills in-left in-right in-space in-hop, and left? right? hop-pressed? ( -- f ). hop-pressed? = space down this frame and up last frame. break? replaces KEY? because KEY? decodes only the first pressed key, so a held arrow could hide BREAK. KBD-SCAN (kernel.asm:753) only writes $FF02 and keeps no debounce state, so it does not disturb vsync or eat keys. keytest.fs (923 B): three boxes; left and right boxes white while held, middle box toggles white/red once per space press; BREAK exits. Not run headless: XRoar -type only intercepts BASIC ROM calls, so it cannot drive this kernel's matrix scan. Waiting for the user: make run-keytest, click the window, hold Left, Right, tap Space, press BREAK (Esc under -kbd-translate). Noted in coco (not this repo): keyboard.fs header has stale SHF column and KB-R7 space notes.\n\nResolution (2026-09-15): user ran make run and played the level: \"it seemed to play. there are issues, but it's not terrible\". Closed at about 80% per the working rule; the issues the user noticed get filed as new issues once described.", "type": "feature", "status": "done", "priority": "high", "tags": ["input"], "created": "2026-09-15", "updated": "2026-09-15"}, {"id": 5, "summary": "Hop physics: straight-up and diagonal hops with gravity, facing, frame by phase, erase/redraw on vsync", "description": "Depends on #3 and #4. The core mechanic and the biggest unknown: does the hop feel right on a 6809.\n\nControls (user spec): left/right choose direction, space hops. Space alone hops straight up. Space while holding an arrow hops up-left or up-right toward the next higher platform. Decide in this issue whether arrows also walk on the ground (not specified; default: arrows only turn the bunny while grounded, keeping the game about hops) and note the choice.\n\n- State in VARIABLEs: x, y in 8.8 fixed point (16-bit cells), vx, vy, grounded?, facing. Anchor = bottom center of the bunny (feet), using the ox/oy table from #3.\n- On hop: vy = -HOP_V, vx = 0 or +/-HOP_DX by arrow held. Each frame while airborne: vy += GRAVITY, x += vx, y += vy. Start with constants giving about 40 rows of lift and about 30 artifact px of reach, tune in #6.\n- Frame choice: grounded hop1; rising hop2; near apex hop3; falling hop4; mirrored set when facing left.\n- For now land on a fixed floor (y = 191) so this issue stands alone; platforms come in #6.\n- Clamp x so the sprite stays in 0..127 and y in 0..191: spr-draw does not clip and VRAM writes past the page corrupt memory.\n- Rendering: record the previous frame's record and position; after vsync, spr-erase-box the old box then spr-draw the new frame (pattern: coco/src/bounce/bounce.fs erase-one/draw-one, and bunny.fs draw-pending for drawing right after vsync). spr-erase-box (kernel.asm:2079) clears to 0, which #6 must account for.\n- Record make cycles (bunny Makefile has the cycles target) cost of one erase+draw for a 28x54 frame; spr-draw is per-pixel, so if it misses the frame budget, file a follow-up for a faster blit rather than blocking.\n\nVerify: make run; hop up, left, right; motion is smooth, no trails, no crash at screen edges. make shot at a few SHOT_AT values mid-hop.\n\nChange 2026-09-15: with the white background (#3), draw with the opaque blit from #12 instead of spr-draw/spr-erase-box, and erase by filling the old box with $FF. The blit is byte aligned, so bunny x moves in steps of 4 artifact pixels (one VRAM byte); keep x in 8.8 fixed point and snap to a multiple of 4 when drawing.\n\nProgress (2026-09-15): implemented in game.fs (bunny-jump.fs is now INCLUDE game.fs main). Positions and velocities in 1/16 px: gravity 4, hop-v 82 (about 52 rows of lift), hop-dx 20, anchor x clamped 28..100 and y >= 58 so no frame leaves the screen. Arrows only turn the bunny while grounded (no walking); space hops straight up, or diagonally with an arrow held. Frame: hop1 grounded, hop2 vy < -20, hop3 near the apex, hop4 vy > 20, left set when facing left. Drawing: blit the new frame, then white only the strips of the old box outside the new box (erase-uncovered), then repair platforms and hearts the boxes touched; skipped when frame and position are unchanged. Headless check: autoplay.fs replaces read-input with a key script and runs the same step word; make shot SHOT_PROG=autoplay SHOT_AT=n at 16 frames (build/autoplay-sheet.png) shows the full climb with clean landings and no trails. Bug found and fixed on the way: the kernel WITHIN reads n one cell too deep (CODE_WITHIN loads 4+2,U), so landing never matched and the bunny fell off the screen and blit overwrote the program; game.fs uses its own in-span?. Filed as #14. Not measured: real frame rate while moving (blit plus strip erase may run at 30 fps). Waiting for the user to play make run and judge the hop feel.\n\nResolution (2026-09-15): user ran make run and played the level: \"it seemed to play. there are issues, but it's not terrible\". Closed at about 80% per the working rule; the issues the user noticed get filed as new issues once described.", "type": "feature", "status": "done", "priority": "high", "tags": ["gameplay", "physics"], "created": "2026-09-15", "updated": "2026-09-15"}, {"id": 6, "summary": "Platforms: hardcoded level table, drawing, landing and falling collision", "description": "Depends on #5. Turns the hop into a platformer.\n\n- Level table: a DATA block or CREATE , list of platforms as (x1 x2 y) in artifact pixels, plus bunny start position and carrot position (used by #7). One hand-made level, staircase-like, so every platform is reachable by a straight or diagonal hop from the one below. Custom screen design is #11, not here.\n- Draw platforms as solid white (code 3) horizontal bars a few rows tall. Fast path: write $FF bytes directly into VRAM rows (32 B per row at vram-base, rv in coco/lib/rg-pixel.fs) instead of per-pixel rg-hline.\n- Collision: only when falling (vy > 0). If the feet move from above a platform top to at or below it this frame and feet x is within x1..x2, snap y to the top, vy = 0, vx = 0, grounded. Walking or hopping off an edge means falling. Bottom of screen is the floor. Hopping up through a platform from below is allowed (one-way platforms), simplest and common.\n- Erase damage: spr-erase-box clears the whole sprite box to black, so after erasing, redraw any platform rows that intersect the old box (cheap: re-fill those byte spans).\n- Tuning: set HOP_V, GRAVITY and HOP_DX from #5 so a hop clears the platform vertical gap with margin and a diagonal hop reaches the next platform horizontally. Record final constants here.\n\nVerify: make run; climb from the floor to the top platform using straight and diagonal hops; falling off edges works; no platform damage after hops.\n\nUser decision 2026-09-15: white background, so the screen is filled with $FF after rg-init and platforms are black (code 0, $00 bytes). Erase uses $FF fill, and the opaque blit from #12 overwrites its whole box with white, so platform repair after an erase still applies.\n\nProgress (2026-09-15): level table in game.fs (x1 x2 y bytes): floor 0-127 at 188, right ledge 68-123 at 148, left ledge 4-59 at 108, carrot ledge 60-123 at 72; 4 rows tall, black on white. Landing only while falling, when the feet cross a platform top this frame and feet x is inside it; platforms are one-way. Platforms intersecting the old or new bunny box are redrawn after each draw. Constants from #5 reach every ledge: the autoplay script climbs floor -> right ledge -> left ledge -> carrot ledge with one diagonal hop each. Waiting for the user to play it.\n\nResolution (2026-09-15): user ran make run and played the level: \"it seemed to play. there are issues, but it's not terrible\". Closed at about 80% per the working rule; the issues the user noticed get filed as new issues once described.", "type": "feature", "status": "done", "priority": "high", "tags": ["gameplay", "level"], "created": "2026-09-15", "updated": "2026-09-15"}, {"id": 7, "summary": "Carrot goal: touch detection, bunny eats carrot, LEVEL COMPLETE, restart", "description": "Depends on #6. Completes the proof-of-concept loop.\n\n- Carrot sits on the top platform at the position from the level table (#6), drawn with the carrot3 record from #3 (red/orange body, blue greens).\n- Detection: bounding-box overlap between the bunny frame box and the carrot box, only while grounded.\n- Eat sequence: freeze input; play munch1-4 with the carrot shrinking carrot3 -> carrot2 -> carrot1 -> carrot0 on bites, like the bunny demo's eat anim (~/github/bunny/tools/frames.json anims, events 2 carrot bite). Hold counts per frame are fine; no sound yet (#10).\n- Then draw LEVEL COMPLETE text. coco/src/bounce/bounce.fs defines rg-char and a HUD using font5x7 (INCLUDE lib/font5x7.fs, init-font, KVAR-RGCHARMIN etc. set in init-bounce); reuse that.\n- Space restarts the level (redraw screen, reset bunny state).\n\nVerify: make run; climb, touch the carrot, watch it get eaten, see the message, restart works. make shot of the complete screen.\n\nProgress (2026-09-15): carrot3 drawn at anchor 104,72. When the bunny is grounded on the carrot ledge with anchor x > 76, eat places it at 88 facing right, plays munch1-4 with 12-frame holds while the carrot is whited and redrawn as carrot2, carrot1, carrot0 and then removed, shows hop1, and waits for space (restart the level) or BREAK. Autoplay frames 215-350 show the bites and the empty ledge. LEVEL COMPLETE text is split out as #13. Waiting for the user to play it.\n\nResolution (2026-09-15): user ran make run and played the level: \"it seemed to play. there are issues, but it's not terrible\". Closed at about 80% per the working rule; the issues the user noticed get filed as new issues once described.", "type": "feature", "status": "done", "priority": "high", "tags": ["gameplay"], "created": "2026-09-15", "updated": "2026-09-15"}, {"id": 8, "summary": "Hearts HUD: red hearts showing lives (display only)", "description": "Depends on #3 and #6. Lives display; losing lives is #9.\n\n- VARIABLE lives, starting at 3.\n- Draw one heart record (#3, all code 2 red) per life along the top-left, spaced a few pixels apart, clear of the top platform and the bunny's highest hop. Redraw on level start and whenever lives changes.\n- If the bunny can hop into the HUD area, either keep the level below it or redraw hearts after erases (same pattern as platform repair in #6).\n\nVerify: make shot shows three red hearts; changing the start value shows that many.\n\nUser decision 2026-09-15: background is white, so hearts are red on white; draw them with the #12 blit.\n\nProgress (2026-09-15): lives = 3; draw-hearts blits the heart record at x 4, 16, 28, y 2, redrawn at level start and by repair whenever a bunny box reaches above row 14. Visible in every autoplay frame. Waiting for the user to confirm.\n\nResolution (2026-09-15): user ran make run and played the level: \"it seemed to play. there are issues, but it's not terrible\". Closed at about 80% per the working rule; the issues the user noticed get filed as new issues once described.", "type": "feature", "status": "done", "priority": "medium", "tags": ["hud", "graphics"], "created": "2026-09-15", "updated": "2026-09-15"}, {"id": 9, "summary": "Death: red bunny and losing a heart (deferred until the mechanic is proven)", "description": "Deferred by the user: the death theme (the user called it the sensitive topic of murder and death) will be discussed after the hop mechanic works. Do not start without that discussion.\n\nKnown pieces so far: red bunny frames are produced by #3 (white -> code 2), lives and hearts by #8. Undecided: what kills the bunny (fall height, hazards, enemies), what happens on death, game over.", "type": "feature", "status": "deferred", "priority": "low", "tags": ["gameplay", "design"], "created": "2026-09-15", "updated": "2026-09-15"}, {"id": 10, "summary": "Sound: boing on hop, crunch on eat", "description": "After the proof of concept. ~/github/bunny has working effects: boing (bunny.fs:215), crunch and chirp, on coco/lib/wavetable.fs and async-sound.fs, stepped from the main loop (bunny.fs:370 vsync draw-pending snd-frame tick). Port boing for hop start and crunch for carrot bites. Watch the frame budget: spr-draw is per-pixel and sound stepping adds cycles.", "type": "feature", "status": "open", "priority": "low", "tags": ["sound"], "created": "2026-09-15", "updated": "2026-09-15"}, {"id": 11, "summary": "Custom screen design: level data format and multiple levels", "description": "After the proof of concept. The user plans custom screen designs. #6 hardcodes one level table (platforms x1 x2 y, bunny start, carrot position). This issue defines a level format (likely ASCII maps converted by a tool, the way bunny's assets/extra/*.txt art is converted), supports several levels, and advances to the next level after the carrot is eaten (#7).", "type": "feature", "status": "open", "priority": "low", "tags": ["level", "tools"], "created": "2026-09-15", "updated": "2026-09-15"}, {"id": 12, "summary": "Opaque byte-aligned RG6 blit CODE word (replaces spr-draw for the white background)", "description": "Depends on #1; needed by #5-#8. User decision 2026-09-15: white background with black-outlined bunny, red and blue accents. Kernel spr-draw (coco/kernel/kernel.asm:1979) treats code 0 as transparent, so it cannot draw black, and it is per-pixel (slow). Replace it with an opaque blit modeled on bunny's CODE blit2x (~/github/bunny/bunny.fs:37), but 1x: the records from #3 already have doubled rows.\n\n- CODE blit ( addr x y -- ): record = w h (coco/lib/sprite.fs layout), then ceil(w/4) bytes per row. x is the left edge in artifact pixels and must be a multiple of 4 (x/4 = byte column), y is the top row. Copy each row's bytes straight into VRAM at vram-base + y*32 + x/4. No clipping: callers keep the box on screen. CODE words must preserve X (IP), U (data stack) and S, and end with ;NEXT (see bunny blit2x).\n- white-box ( addr x y -- ) or a generic fill-box ( x y wbytes h byte -- ) to erase the old frame to $FF.\n- Put both in blit.fs, INCLUDEd by the game.\n\nTrade-off accepted: horizontal motion is in 4-artifact-pixel steps; a masked sub-byte blit is a possible follow-up.\n\nVerify: a test program draws the #3 frames on a white screen at several x; make shot (#2) matches preview.png; record make cycles cost for a 28x54 frame (7 bytes x 54 rows).\n\nProgress (2026-09-15): blit.fs has CODE blit ( addr x y -- ) (byte copy, rv-relative, VARIABLEs blt-dst blt-w blt-h), Forth fill-box ( x y wbytes h byte -- ), white-box ( addr x y -- ) and white-screen. blittest.fs draws an 8x8 record at the four corners and at 40,100 and 80,100, and draws then white-boxes one at 60,100. make shot SHOT_PROG=blittest SHOT_AT=5 shows all six boxes with a white gap at 60,100, so drawing, placement and erase work. fc.py --cycles: blit 194 cy setup + ~54 cy per row + ~17 cy per byte, so a 28x54 frame (7 B x 54 rows) is ~9,500 cy, about 64% of a 14,917 cy frame. Erase through Forth fill-box adds a FILL per row on top, so a moving bunny may hold 30 fps; #5 should measure and, if needed, erase only the strips the new frame does not cover (bunny's erase-uncovered, ~/github/bunny/bunny.fs:169). Waiting for the user to run make run-blittest and confirm.\n\nUsed by game.fs for every draw since 2026-09-15; the autoplay contact sheet (see #5) shows no drawing faults. Still waiting for the user to run make run-blittest or the game.\n\nResolution (2026-09-15): user ran make run and played the level: \"it seemed to play. there are issues, but it's not terrible\". Closed at about 80% per the working rule; the issues the user noticed get filed as new issues once described.", "type": "feature", "status": "done", "priority": "high", "tags": ["graphics", "asm"], "created": "2026-09-15", "updated": "2026-09-15"}, {"id": 13, "summary": "LEVEL COMPLETE text that reads on the white RG6 screen", "description": "Split from #7 under the close-at-80% rule. #7 ends the level with the eat animation and waits for space (restart) or BREAK, but shows no text.\n\nWhy it was not done in #7: coco/lib/font5x7.fs glyphs are 5 dots wide at 1 bit per dot (font-base $5800 in ROM mode), and the kernel rg-char (kernel.asm:2134) copies glyph bytes straight into RG6 VRAM. On an NTSC artifact screen single-dot strokes turn into blue and red fringes, and on the white background the bits would also need inverting.\n\nOptions: (a) expand each font bit to a 2-bit artifact pixel (00 black on white 11), giving 5 artifact pixels (10 dots) per glyph column, drawn with fill-box or a small CODE word; (b) hand-drawn LEVEL COMPLETE banner as an ASCII art frame in tools/frames.json ('k' black pixels), blitted centred; cheapest and matches the art pipeline. (b) is recommended for the proof of concept.\n\nVerify: make shot after eating the carrot shows readable black text on white.", "type": "feature", "status": "open", "priority": "medium", "tags": ["hud", "graphics"], "created": "2026-09-15", "updated": "2026-09-15"}, {"id": 14, "summary": "coco kernel WITHIN reads n one cell too deep", "description": "Found while building #5/#6 on 2026-09-15. ~/github/coco/kernel/kernel.asm CODE_WITHIN ( n lo hi -- flag ) loads lo from 2,U and hi from ,U correctly, but loads n with LDD 4+2,U, which is the cell below n (n is at 4,U; the PSHS calls push to S, not U). So WITHIN compares whatever sits under its arguments. In bunny-jump the land? test passed a -1 flag there, so landing never matched, the bunny fell below the screen and blit wrote past VRAM into the program. It also returns 1 for true where = < > 0= return -1.\n\nbunny-jump works around it with in-span? in game.fs. The fix belongs in the coco repo (LDD 4,U, and return -1), plus a test; check other users of WITHIN there first. This issue tracks reporting or fixing it upstream; nothing to change here.", "type": "bug", "status": "open", "priority": "low", "tags": ["upstream", "kernel"], "created": "2026-09-15", "updated": "2026-09-15"}, {"id": 15, "summary": "Bunny shading: blue specks along the outline", "description": "From the #3 white-background conversion on 2026-09-15. tools/frames.json maps the sheet mid grey (130,124,124) to code 1 blue, which lands as scattered single blue pixels along the black outline (visible in build/preview.png and every make shot). The user asked for red and blue accents but deferred appearance tweaks. Options: map mid grey to 0 black for a cleaner outline and put blue somewhere deliberate (eye, inner ear), or hand-touch the frames. One-line change in frames.json colors, then make preview.", "type": "feature", "status": "open", "priority": "low", "tags": ["assets", "polish"], "created": "2026-09-15", "updated": "2026-09-15"}, {"id": 16, "summary": "Smoother sideways motion than 4-pixel byte steps", "description": "Accepted trade-off from #12: blit is byte aligned, so the anchor x snaps to multiples of 4 artifact pixels and a diagonal hop moves sideways in visible 4-pixel jumps. Options: a CODE blit with a 2-pixel (half byte) offset using a shifted copy of each record, or a masked per-row shift. Only worth doing if the user finds the motion too steppy after playing #5.", "type": "feature", "status": "open", "priority": "low", "tags": ["graphics", "asm", "polish"], "created": "2026-09-15", "updated": "2026-09-15"}, {"id": 17, "summary": "Run the game at 60 fps with no sprite flicker", "description": "User goal, first priority (2026-09-15): after playing, the user found sprite flickering and asked whether it runs at 60 fps, \"that's our first goal\".\n\nKnown before measuring: a moving bunny redraws every frame. blit (blit.fs) is ~194 cy + ~54 cy/row + ~17 cy/byte, ~9,500 cy for a 28x54 frame, of a 14,917 cy NTSC frame (fc.py --cycles). On top of that: erase-uncovered strips through the Forth fill-box DO loop, platform/heart repair, and physics/land? in Forth (game.fs). So the loop very likely overruns and runs at 30 fps or worse while hopping. Physics advances once per loop pass, so overruns also slow the hop (see #18).\n\nFlicker cause: drawing happens on the visible page while the beam scans it, and erase and draw are separate passes, so some fields show a half-erased or half-drawn bunny.\n\nPlan:\n1. Measure: count overrun fields per loop pass in autoplay (field-sync flag already set before vsync) and read per-word cycle estimates from fc.py --cycles.\n2. Cut cost: blit copying 16-bit words (LDD ,Y++ / STD ,U++), fill-box as a CODE word, cheaper land?/repair.\n3. Page flipping: draw into a hidden second RG6 page and switch SAM F (set-sam-f) at vsync, so the displayed page is never mid-draw. Each page erases what it last showed there (two frames ago). Needs a second 6144 B $0200-aligned region outside the app, font and stacks.\n\nVerify: overrun counter stays 0 through the autoplay climb; user confirms no flicker in make run.\n\nMeasured (2026-09-15): autoplay.fs with a probe word in game.fs that clears and counts the field-sync flag ($FF03 bit 7, cleared by reading $FF02 like kernel VSYNC) between steps, one counter per spot at $7000-$700A, passes at $7002, read from make shot RAM dumps. Standing still: 60 fps (no redraw). Before any change: frames 0-45 (first hop) took 106 fields for 45 passes (25.5 fps average), the climb to frame 175 took 363 fields (28.9 fps); hopping passes take about 2.7 fields each, so about 22 fps while moving. Extra fields by spot through frame 175: end of pass (repair, input, loop) 82, blit 61, erase 23, pre-blit 22, physics 0 (position bias: a spot right after vsync rarely sees a field end). So a moving pass costs roughly 40,000 cy against 14,917, far more than the fc.py --cycles worst-case estimates suggested. First two changes (fill-box as CODE, frame address table spr@ instead of the 19-way spr test) cut the static estimates (draw-frame 29,882 -> 16,907 cy) but did not change the measured overrun pattern. Next: the whole draw path as one CODE word (move-sprite), then page flipping, then physics if still needed.\n\nResolution (2026-09-15): the per-frame path is now CODE. move-sprite (game.fs) blits two bytes at a time and erases only the uncovered strips; fast.fs adds physics-air (gravity, clamps, one-way landing over the level table), frame-pos (anchor plus offset) and repair-mask (repair redraws only touched platforms and hearts). init-tables copies tuning constants and table addresses into cells the CODE words read. Measured with the autoplay probe: frames 0-45 went from 106 fields (25.5 fps average) to 73 (37.0), the climb to frame 175 from 363 fields (28.9) to 259 (40.5); remaining extra fields fall at end of pass 53 and move-sprite 31, none in physics or pre-draw. Hopping passes now mostly fit one field with some taking two. Autoplay shots at frames 30-290 still show correct hops, landings, carrot and hearts. User said \"i think we're ok now\", so closed at about 80%. Not done: a steady 60 fps on every hopping frame and page flipping to remove flicker, filed as #19.", "type": "feature", "status": "done", "priority": "high", "tags": ["performance", "graphics"], "created": "2026-09-15", "updated": "2026-09-15"}, {"id": 18, "summary": "Hop feel: faster, less floaty", "description": "User feedback 2026-09-15: \"the hop feels too slow and floaty\". Depends on #17: physics steps once per loop pass, so at 30 fps every hop takes twice as long; retune only once the loop holds 60 fps.\n\nCurrent constants (game.fs): gravity 4, hop-v 82, hop-dx 20 in 1/16 px per frame: about 52 rows of lift and ~41 frames in the air for a same-level hop (0.7 s at 60 fps, ~1.4 s at 30). Direction: raise gravity and take-off speed together so the height still clears the 36-40 row ledge gaps but airtime drops, e.g. gravity 8, hop-v 116 (~25 frames), and scale hop-dx so diagonal hops still reach the next ledge (the autoplay script checks this). Possibly also a faster fall than rise. Verify with make run; the user judges feel.\n\nProgress (2026-09-15): retuned for the 1x1 bunny now that physics runs per field (#19): gravity 8 (was 4), hop-v 111 (82), hop-dx 28 (20), ceiling min-ay 30 (58, for the shorter frames), frame thresholds vy -40/+40 (was -20/+20). About 48 rows of lift, top of the hop in 14 fields (was 21), so a hop to the next ledge takes about a third of a second. Autoplay confirms each diagonal hop still reaches the next ledge (floor to right ledge, right to left, left to carrot ledge). Waiting for the user to judge the feel in make run.\n\nResolution (2026-09-15): user ran make run on commit 348dbec: \"ok that's working\". Closed.", "type": "feature", "status": "done", "priority": "high", "tags": ["gameplay", "physics"], "created": "2026-09-15", "updated": "2026-09-15"}, {"id": 19, "summary": "Steady 60 fps and no flicker: page flipping and the last per-pass costs", "description": "Remainder of #17 (closed 2026-09-15 at ~40 fps average through the autoplay climb, most hop passes within one field). Still open: (1) flicker, because frames are drawn on the visible page; (2) the passes that still overrun, with extra fields at end of pass (repair/input/loop overhead) and inside move-sprite.\n\nPage flipping draft: pageflip-draft.fs (not INCLUDEd). Second RG6 page at $6000-$77FF (above app and font $5800, below data stack $7E00), per-page d-frame/d-x/d-y/d-w/d-h cells so each page erases what it last showed, flip = vsync then set-sam-f to the drawn page and swap rv. move-sprite and repair-mask must then use per-page cells (the CODE words name FVAR_d_x etc. directly, so switch them to page-indexed tables or copy the page's cells in and out around the call). set-sam-f is Forth (coco/lib/vdg.fs) and may need a CODE version to fit vblank.\n\nCheaper blit: move-sprite spends ~75 cy per row on reloading blt-dst and the pair counter; keep U advancing with LEAU by 32-wbytes and a register counter. Measure with autoplay.fs probes (counters at $7000-$7008, passes at $7002) via make shot SHOT_PROG=autoplay SHOT_AT=n. User confirms flicker is gone in make run.\n\nProgress (2026-09-15): page flipping and field-based timing are in. fast.fs: second RG6 page at $6000; flip = field-check, vsync, show-page (SAM F offset from rv, written through $FFC6-$FFD3), swap-page (swaps rv/rv-alt and the per-page bunny box cells d-frame d-x d-y d-w d-h with a-*), so each page erases the bunny it last showed and the visible page is never mid-draw. start-level draws the static screen on both pages; eat-step draws each bite on both pages. Timing: missed counts fields that ended mid-pass (field-check before vsync, a check after the blit in move-sprite); show-page sets fields = missed + 1 (max 4) and physics-air runs that many steps, stopping on landing. Speed: read-input is one CODE word (was four Forth KEY-HELD? calls), cur-frame is CODE, at-carrot? runs only when grounded, and the move-sprite blit walks U with its counters on the stack (~42 cy per row, was ~95). Measured through autoplay (stats at $7A00 fields, $7A02 flips, $7A04 page shown; make shot now renders the shown page via tools/rg6shot.py --page-ptr): 165 flips took 167 fields, and both extra fields are at level start (3 flips, 5 fields), so play runs at a steady 60 fps. Before this issue: 40.5 fps average (doubled art), 48.2 with 1x art. Autoplay contact sheet shows correct hops, landings, carrot and no leftover images. Waiting for the user to confirm in make run that the flicker is gone.\n\nResolution (2026-09-15): user ran make run on commit 348dbec: \"ok that's working\". Closed.", "type": "feature", "status": "done", "priority": "medium", "tags": ["performance", "graphics"], "created": "2026-09-15", "updated": "2026-09-15"}, {"id": 20, "summary": "Experiment: 1x1 sprite rows instead of doubled", "description": "User asked on 2026-09-15 to see the bunny at 1x1 (source rows not doubled) in the emulator. #3 doubles rows because RG6 artifact pixels are 2 dots wide by 1 scanline tall, so 1x1 art is squashed to half height. A mock render (same level, doubled vs 1x1) showed the 1x1 bunny reads as a flat mouse-like shape, but costs half the rows: hop1 28x54 380 B doubled vs 28x27 191 B, so about half the blit work (helps #19) and much more vertical room for platforms.\n\nBuild: tools/png2rg6.py --rows 1 --suffix -1x writes build/sprites-1x.fs; bunny-jump-1x.fs INCLUDEs it with the same game.fs (game.fs no longer INCLUDEs sprites itself; each program file picks its art). make run-bunny-jump-1x.\n\nDecision pending from the user after seeing it: keep doubled, adopt 1x1, or redraw frames at RG6 proportions (~28 x 27-30, recommended if the smaller bunny is wanted). Physics and level constants were left tuned for the doubled bunny.\n\nResolution (2026-09-15): user ran make run-bunny-jump-1x: \"tbh 1x1 is pretty good ... i'm pretty ok with 1x1 and it's just faster too\". 1x1 rows are now the default in tools/png2rg6.py (--rows 2 restores doubling); the bunny-jump-1x.fs variant and its mk rule were removed. Sprite data is 2908 B instead of 5778 B, and hop1 is 28x27. Physics and level constants are still those tuned for the tall bunny (min-ay 58 ceiling, 36-40 row ledge gaps); revisit with #18 and #11. Art touch-ups the user asked for are #21.", "type": "task", "status": "done", "priority": "medium", "tags": ["assets", "experiment"], "created": "2026-09-15", "updated": "2026-09-15"}, {"id": 21, "summary": "1x1 bunny art: less pointy head/nose, puffier tail", "description": "User feedback 2026-09-15 after choosing 1x1 rows (#20): \"the head/nose is a little too pointy and his tail could be slightly more puffy\".\n\nThe hop, munch and red frames come straight from assets/bunnysheet5.png crops (tools/frames.json), squashed to half height, which sharpens the snout and flattens the tail. Approach: export each 1x frame to an ASCII art file under assets/extra/ (the existing art format: . transparent, k black, c/b blue, o/r red, w white), hand-edit the snout rounder and add a pixel or two of tail puff, and switch those frames in frames.json from box crops to art entries with the same ox/oy anchors (mirrors and red recolors follow automatically). Check in build/preview.png and make shot; the user judges the look.", "type": "feature", "status": "open", "priority": "medium", "tags": ["assets", "polish"], "created": "2026-09-15", "updated": "2026-09-15"}, {"id": 22, "summary": "Hearts are earned: start with none, one per carrot eaten", "description": "User request 2026-09-15: \"each time he eats a carrot he gets a heart? he starts with no hearts.\"\n\ngame.fs: the lives cell from #8 becomes hearts, starting at 0 in main (and autoplay.fs). eat adds 1 before its last eat-step, and eat-step draws the hearts on both pages so the new heart shows right after the last bite whichever page is displayed. Hearts carry over when space restarts the level (start-level redraws them). Drawing caps at max-hearts = 10 (x 4..120 at 12 px spacing on the 128 px screen); the count itself keeps going. Not decided: what hearts are for (lives for #9 death, score) and whether more than 10 should show differently.\n\nVerify: autoplay make shot shows no hearts at the start and one heart after the carrot is eaten; user confirms in make run.\n\nResolution (2026-09-15): user ran make run on commit fc3c09b: \"ok that's good. it stops at 10 hearts which is fine.\" Closed. The cap of 10 drawn hearts stays; what hearts are used for is still open (ties into #9).", "type": "feature", "status": "done", "priority": "high", "tags": ["gameplay", "hud"], "created": "2026-09-15", "updated": "2026-09-15"}, {"id": 23, "summary": "Arrow presses turn or step the bunny instead of only turning", "description": "User request 2026-09-15: \"when pressing right or left the bunny changes direction but does not hop. if the right or left buttons are pressed the bunny shouldn't hop, but step a small amount in that direction. if the bunny isn't facing the direction of the arrow, it simply turns around, the 2nd time that arrow is pressed it takes a step. jumping with the spacebar still jumps\".\n\nDesign: on the ground, an arrow press (edge, not hold) turns the bunny when it faces the other way, or steps step-dx = 64 (4 pixels, one VRAM byte, the byte-aligned blit's smallest move) when it already faces that way, clamped to the screen limits. Space still hops and wins over an arrow press on the same frame; space with an arrow held still hops diagonally. Each press is one step (no hold-to-walk, not requested). Stepping can now leave a ledge: supported? checks for a platform top at the feet row under the foot x, and if none the bunny starts falling and physics-air lands it. input.fs read-input adds in-lpress/in-rpress edge cells; game.fs step-or-turn replaces turn; autoplay.fs tests left turn, left step, right turn, right step before the climb.\n\nVerify: autoplay shots show the turn and the 4 pixel steps and the climb still works; user confirms in make run.\n\nProgress (2026-09-15): implemented. Autoplay shots measured the bunny's left edge on the floor: start 24, after left press 23 (turned, mirrored frame), after second left press 19 (stepped 4 px), after right press 20 (turned back), after second right press 24 (stepped back). The climb, carrot and heart still work (vsync 75, 140, 210, 350). Not exercised headless: walking off a ledge edge into a fall. Waiting for the user to try it in make run.\n\nResolution (2026-09-15): user ran make run: \"stepping is ok, but there's no animation. stepping off the edge has a nice animation.\" Closed at about 80%; the missing step animation is #24.", "type": "feature", "status": "done", "priority": "high", "tags": ["gameplay", "input"], "created": "2026-09-15", "updated": "2026-09-15"}, {"id": 24, "summary": "Animate the bunny's step", "description": "Split from #23 on 2026-09-15. The user found stepping ok but noted \"there's no animation\" (the bunny just jumps 4 pixels), while walking off a ledge already looks good because the falling hop frames play.\n\nDesign: a step plays the sheet's hop cycle in place: hop2, hop3, hop4 for 3 fields each (step-fields = 9, about 150 ms), then hop1. game.fs: step-t counts fields left, set by step-or-turn on a step, cleared by hop! and when a step walks off a ledge (the fall frames take over), counted down by fields in physics so it keeps real-time speed; anim-frame picks the step frame (left-facing set when facing left) or falls back to cur-frame. A new arrow press during the animation restarts it; space interrupts it with a hop. The 4 pixel move still happens at the start of the step.\n\nVerify: autoplay shots right after the scripted left step show hop2, hop3, hop4 then hop1; user judges the look in make run.\n\nProgress (2026-09-15): implemented. Autoplay shots after the scripted left step (bunny facing left on the floor), bunny pixel span: vsync 21 hop1 23..47, 23 hop2 19..44, 26 hop3 12..44, 29 hop4 5..33, 32 hop1 19..43 (4 px left of the start, as intended). Open question for the user: hop4 reaches 14 px past the resting position (the sheet bakes forward motion into it), so the bunny may look like it lunges then snaps back; dropping hop4 (hop2, hop3, hop2) is a one-line change in anim-frame. Waiting for the user in make run.\n\nResolution (2026-09-15): user tried the step animation in make run and replied \"ok\" (the hop4 reach was not raised as a problem). Closed.", "type": "feature", "status": "done", "priority": "high", "tags": ["gameplay", "animation"], "created": "2026-09-15", "updated": "2026-09-15"}, {"id": 25, "summary": "Bunny steps forward as it eats the carrot", "description": "User request 2026-09-15: \"just like the bunny demo, when he eats the carrot he needs to step forward as it disappears\". In ~/github/bunny the eat anim stepped the bunny right after each bite by about what the bite removed (tools/frames.json anims doc).\n\nHere each carrot bite frame trims 4 pixels off the left tip (carrot3 at x 104, carrot2 ox +4, carrot1 +8, carrot0 +12, then gone). eat now starts the munch at anchor 88 (munch box 72..104 ends at the tip) and adds step-dx (4 px) before bites 2-4, ending at 100 (the max-ax limit). eat-step redraws the carrot before the bunny, since the munch box ends exactly at the new tip and would otherwise be clipped by white-carrot.\n\nVerify: autoplay shots through the eat show the bunny's right edge following the carrot tip; user confirms in make run.\n\nProgress (2026-09-15): implemented. Autoplay shots every 6 vsyncs through the eat, bunny outline span on the carrot ledge: standing 76..100, munch1 75..100, munch2 78..104, munch3 83..110, munch4 87..114, final hop1 88..112, so the bunny moves 4 px per bite and ends at anchor 100. A cropped strip shows the carrot trimmed from the tip each bite (full, shorter, greens only, gone) with no clipping between bunny and carrot. The bunny keeps a small gap to the tip rather than touching it. Waiting for the user in make run.", "type": "feature", "status": "in-progress", "priority": "high", "tags": ["gameplay", "animation"], "created": "2026-09-15", "updated": "2026-09-15"}, {"id": 26, "summary": "Publish as a public GitHub repo with an up-to-date README and licenses", "description": "User request 2026-09-15: \"make this gh repo public. please make sure the README is up to date and that our licenses are in order\".\n\nDone in this change: README.md rewritten (gameplay, controls, requirements with the coco link and tested commit b5158e6, make targets including shot/run-name, file map, status, license, credits) with a screenshot.png from make shot; LICENSE added (BSD 2-Clause, same text and copyright line as ~/github/bunny and the coco project); CREDITS.md updated for this game's derived art (1x1 RG6 hop/munch frames generated at build time, carrot frames from the bunny demo, new heart, screenshot) under CC-BY-SA 3.0, with the original sheet under CC-BY 3.0 / CC-BY-SA 3.0 / OGA-BY 3.0. pageflip-draft.fs removed (superseded by fast.fs, #19). Checked before publishing: no home-directory paths, emails or secrets in tracked files; all commits use the GitHub noreply address. Repo: ugufru/bunny-jump, public, pushed from main.", "type": "task", "status": "in-progress", "priority": "high", "tags": ["docs", "release"], "created": "2026-09-15", "updated": "2026-09-15"}], "roadmap": [{"rank": 1, "id": 25, "why": "The user's current request: a small change to the eat sequence that finishes the level-complete moment.", "added": "2026-09-15"}, {"rank": 2, "id": 21, "why": "The user's art notes on the new 1x1 bunny. Cheap and independent of the engine work, so it slots in right after the flicker fix the user called unacceptable.", "added": "2026-09-15"}, {"rank": 3, "id": 2, "why": "Cheap tooling that makes every later issue verifiable from a PNG, without depending on the XRoar window (which bunny found unreliable on another macOS Space).", "added": "2026-09-15"}, {"rank": 4, "id": 13, "why": "Last piece of the proof-of-concept ending. The hand-drawn banner option reuses the sprite pipeline, so it is small once the user has played the loop.", "added": "2026-09-15"}]}</script>
<script>
(function () {
  var STATUS_ORDER = ['open', 'in-progress', 'done', 'deferred', 'wontfix'];
  var PRIORITY_ORDER = ['high', 'medium', 'low'];
  var LIVE = ['open', 'in-progress'];
  var KEY = 'issues-view:' + location.pathname;
  // Longest alternative first: "jsonl" must win over "json".
  var PATH_RE = /\b((?:[\w.-]+\/)*[\w.-]+\.(?:jsonl|json|md|html|css|js|ts|tsx|jsx|py|rb|go|rs|java|c|h|cpp|sh|toml|ya?ml|cfg|ini|txt|bas|dsk|png))(:\d+(?:-\d+)?)?/g;

  var issues = [];
  var active = { status: [], type: [], tag: [] };
  var q = document.getElementById('q');
  var list = document.getElementById('list');
  var count = document.getElementById('count');
  var empty = document.getElementById('empty');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function rank(v, order) {
    var i = order.indexOf(v);
    return i === -1 ? order.length : i;
  }

  function markup(text) {
    return String(text).split('\n\n').map(function (para) {
      return '<p>' + esc(para).replace(PATH_RE, '<code>$&</code>').replace(/\n/g, '<br>') + '</p>';
    }).join('');
  }

  function summaryOf(i) { return i.summary || i.title || '(untitled)'; }
  function tagsOf(i) { return i.tags || i.labels || []; }

  function card(i) {
    var status = i.status || '?', priority = i.priority || '?', type = i.type || '?';
    var el = document.createElement('article');
    el.className = 'card';
    el.id = 'i' + i.id;
    el.dataset.status = status;
    el.dataset.type = type;
    el.dataset.tags = tagsOf(i).join(' ');
    el.innerHTML =
      '<header><button class="row" aria-expanded="false">' +
      '<span class="id">#' + esc(i.id) + '</span>' +
      '<span class="summary">' + esc(summaryOf(i)) + '</span>' +
      '<span class="chips">' +
        '<span class="chip st-' + esc(status) + '">' + esc(status) + '</span>' +
        '<span class="chip pr-' + esc(priority) + '">' + esc(priority) + '</span>' +
        '<span class="chip ty">' + esc(type) + '</span>' +
      '</span><span class="caret" aria-hidden="true"></span></button></header>' +
      '<div class="body" hidden><div class="desc">' +
      markup(i.description || '(no description)') + '</div><footer>' +
      tagsOf(i).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') +
      '<span class="meta"><code>' + esc(i.file || '-') + '</code> &middot; created ' +
      esc(i.created || '?') + ' &middot; updated ' + esc(i.updated || '?') +
      '</span></footer></div>';
    el.querySelector('.row').addEventListener('click', function () {
      setOpen(el, el.querySelector('.body').hidden);
    });
    return el;
  }

  function setOpen(el, open) {
    el.querySelector('.row').setAttribute('aria-expanded', open);
    el.querySelector('.body').hidden = !open;
  }

  // The roadmap stores only rank, id and why. Everything shown here is joined
  // from the tracker, so an entry pointing at a missing or finished issue is
  // visibly wrong rather than quietly stale.
  function drawRoadmap(plan, byId) {
    if (!plan.length) return;
    var host = document.getElementById('plan');
    plan.slice().sort(function (a, b) { return (a.rank || 0) - (b.rank || 0); })
      .forEach(function (e) {
        var issue = byId[e.id];
        var li = document.createElement('li');
        li.className = 'step';
        var head, warn = '';
        if (!issue) {
          head = '#' + esc(e.id) + ' is not in the tracker';
          warn = 'no such issue';
          li.className += ' bad';
        } else {
          head = '<a href="#i' + esc(e.id) + '">#' + esc(e.id) + ' ' +
                 esc(summaryOf(issue)) + '</a> <span class="chip st-' +
                 esc(issue.status) + '">' + esc(issue.status) + '</span>';
          if (LIVE.indexOf(issue.status) === -1) {
            warn = 'already ' + issue.status + ', take it off the roadmap';
            li.className += ' bad';
          }
        }
        li.innerHTML = '<span class="rank">' + esc(e.rank || '?') + '.</span>' +
          '<span class="what">' + head +
          '<span class="why">' + esc(e.why || '') + '</span>' +
          (warn ? '<span class="warn">' + esc(warn) + '</span>' : '') + '</span>';
        var link = li.querySelector('a');
        if (link) {
          link.addEventListener('click', function () {
            var target = document.getElementById('i' + e.id);
            if (target) { target.hidden = false; setOpen(target, true); }
          });
        }
        host.appendChild(li);
      });
    document.getElementById('roadmap').hidden = false;
  }

  function pills(host, filter, values, counts) {
    document.getElementById(host).innerHTML = values.map(function (v) {
      return '<button class="pill" data-filter="' + filter + '" data-value="' + esc(v) + '">' +
        esc(v) + (counts ? ' <span class="n">' + counts[v] + '</span>' : '') + '</button>';
    }).join('');
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ active: active, q: q.value }));
    } catch (e) {}
  }

  function apply() {
    var needle = q.value.trim().toLowerCase();
    var shown = 0;
    [].forEach.call(list.children, function (el) {
      var ok =
        (!active.status.length || active.status.indexOf(el.dataset.status) !== -1) &&
        (!active.type.length || active.type.indexOf(el.dataset.type) !== -1) &&
        (!active.tag.length || active.tag.some(function (t) {
          return el.dataset.tags.split(' ').indexOf(t) !== -1;
        })) &&
        (!needle || el.textContent.toLowerCase().indexOf(needle) !== -1);
      el.hidden = !ok;
      if (ok) shown++;
    });
    empty.hidden = shown !== 0;
    count.textContent = shown + ' of ' + issues.length + ' shown';
    [].forEach.call(document.querySelectorAll('.pill'), function (p) {
      p.setAttribute('aria-pressed', active[p.dataset.filter].indexOf(p.dataset.value) !== -1);
    });
    save();
  }

  function draw(data, plan, note) {
    issues = data.slice().sort(function (a, b) {
      return rank(a.status, STATUS_ORDER) - rank(b.status, STATUS_ORDER) ||
             rank(a.priority, PRIORITY_ORDER) - rank(b.priority, PRIORITY_ORDER) ||
             (a.id || 0) - (b.id || 0);
    });

    var counts = {}, byId = {};
    STATUS_ORDER.forEach(function (s) { counts[s] = 0; });
    issues.forEach(function (i) {
      counts[i.status] = (counts[i.status] || 0) + 1;
      byId[i.id] = i;
    });

    list.innerHTML = '';
    issues.forEach(function (i) { list.appendChild(card(i)); });
    drawRoadmap(plan || [], byId);

    pills('f-status', 'status', STATUS_ORDER.filter(function (s) { return counts[s]; }), counts);
    pills('f-type', 'type', unique(issues.map(function (i) { return i.type || '?'; })));
    pills('f-tag', 'tag', unique([].concat.apply([], issues.map(tagsOf))));

    [].forEach.call(document.querySelectorAll('.pill'), function (p) {
      p.addEventListener('click', function () {
        var l = active[p.dataset.filter], i = l.indexOf(p.dataset.value);
        if (i === -1) l.push(p.dataset.value); else l.splice(i, 1);
        apply();
      });
    });

    var open = (counts.open || 0) + (counts['in-progress'] || 0);
    document.getElementById('lede').innerHTML =
      issues.length + ' issues, ' + open + ' of them still open' +
      ((plan && plan.length) ? ', ' + plan.length + ' on the roadmap' : '') +
      '. Read from <code>issues.jsonl</code>.';
    if (note) {
      var n = document.getElementById('note');
      n.textContent = note;
      n.hidden = false;
    }

    try {
      var s = JSON.parse(localStorage.getItem(KEY) || '{}');
      if (s.active) active = s.active;
      if (s.q) q.value = s.q;
    } catch (e) {}

    apply();

    if (location.hash) {
      var target = document.querySelector(location.hash);
      if (target && target.classList.contains('card')) {
        target.hidden = false;
        setOpen(target, true);
        target.scrollIntoView();
      }
    }
  }

  function unique(a) {
    return a.filter(function (v, i) { return a.indexOf(v) === i; }).sort();
  }

  q.addEventListener('input', apply);
  document.getElementById('reset').addEventListener('click', function () {
    active = { status: [], type: [], tag: [] };
    q.value = '';
    apply();
  });
  document.getElementById('expand').addEventListener('click', function () {
    [].forEach.call(list.children, function (c) { if (!c.hidden) setOpen(c, true); });
  });
  document.getElementById('collapse').addEventListener('click', function () {
    [].forEach.call(list.children, function (c) { setOpen(c, false); });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
    if (e.key === 'Escape' && document.activeElement === q) { q.value = ''; apply(); }
  });

  function lines(text) {
    return text.split('\n').filter(function (l) { return l.trim(); }).map(JSON.parse);
  }

  function grab(name) {
    return fetch(name, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(lines);
  }

  // The live files first. Browsers refuse a file:// fetch, so fall back to the
  // snapshot baked in at build time and say which one is on screen. A missing
  // roadmap.jsonl is not an error: the section just stays hidden.
  grab('issues.jsonl')
    .then(function (data) {
      grab('roadmap.jsonl')
        .catch(function () { return []; })
        .then(function (plan) { draw(data, plan); });
    })
    .catch(function () {
      var snap = JSON.parse(document.getElementById('snapshot').textContent);
      draw(snap.issues, snap.roadmap,
        'Showing the snapshot saved when this page was last built, because the browser would ' +
        'not read the .jsonl files from disk. To see them live, serve the directory ' +
        '(python3 -m http.server) and open it over http, or rebuild this page.');
    });
})();
</script>
</body>
</html>
